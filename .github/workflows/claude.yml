name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Bash(git:*),Bash(python3:*),Bash(pip install:*)"
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      - name: Check out the branch Claude actually committed to
        # The action creates/pushes its branch via the GitHub API, not local
        # git commands - the initial checkout's working tree does not
        # reflect it automatically. branch_name is empty if no branch was
        # created (e.g. a run that only answered without committing).
        if: always() && steps.claude.outputs.branch_name != ''
        run: |
          git fetch origin "${{ steps.claude.outputs.branch_name }}"
          git checkout "${{ steps.claude.outputs.branch_name }}"
      - name: Package project deliverables as a downloadable artifact
        if: always()
        run: |
          if [ -d "projects" ] && [ -n "$(find projects -mindepth 1 -maxdepth 1 -type d 2>/dev/null)" ]; then
            zip -r pbi-projects.zip projects/
            echo "Zipped projects/ -> pbi-projects.zip"
          else
            echo "No projects/ directory with content yet - nothing to package."
          fi
      - name: Upload project deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbi-projects
          path: pbi-projects.zip
          if-no-files-found: ignore
          retention-days: 30
